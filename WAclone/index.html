<!DOCTYPE html>
<html lang="en">

<head>
    <style>
  body {
    position: relative;
    max-width: 450px;
    margin: 0 auto;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('img/bgImg.jpg') no-repeat center center/cover;
    opacity: 0.4;
    z-index: -1;
  }

  main {
    position: relative;
    z-index: 1;
  }
</style>

        
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA-Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
</head>

<body class=" max-w-[450px] mx-auto h-screen py-7 ">

    <main class="border w-full select-none bg-white ">
        <header>
            <nav class="WA-navbar h-28 max-w-[450px] bg-[#006054] mx-auto">
                <div class="flex items-center justify-between px-2 pt-3">
                    <h1 class="text-white text-2xl font-bold">WhatsApp</h1>
                    <div class="text-white">
                        <span class="material-symbols-outlined">
                            search
                        </span>
                        <span class="material-symbols-outlined ml-[3px]">
                            more_vert
                        </span>
                    </div>
                </div>
                <div class="text-white flex items-center justify-between mt-8 px-3
        "><span class="material-symbols-outlined ">
                        photo_camera
                    </span>
                    <h3 class="font-bold text-xl ">Chats <span
                            class="bg-white text-[#006054] text-sm rounded-full px-[6px]">1</span></h3>
                    <h3 class="font-bold text-xl">Status</h3>
                    <h3 class="font-bold text-xl">Calls</h3>
                </div>
            </nav>

        </header>
        <section class="h-[700px]">
            <div class="flex items-center justify-between py-[15px] px-3">
                <div class="flex items-center justify-between gap-4">
                    <img class="size-[55px] rounded-full object-top object-cover" src="img/ertugrul.jfif" alt="">

                        <span class="font-bold text-lg">Ertugrul Bey</span>
                        <span>Noyan'la savaşacağız.</span>
                    </div>
                </div>
                <div class="text-xs">9:11 AM</div>
            </div>
            <div class="flex items-center justify-between py-[9px] px-3">
                <div class="flex items-center justify-between gap-4">
                    <img class="size-[55px] rounded-full object-top object-cover" src="img/turgut.jpg" alt="">
                    <div class="flex flex-col justify-center">
                        <span class="font-bold text-lg">Turgut Alp</span>
                        <span>Tamam patron.</span>
                    </div>
                </div>
                <div class="text-xs">9:14 AM</div>
            </div>
            <div class="flex items-center justify-between py-[9px] px-3">
                <div class="flex items-center justify-between gap-4">
                    <img class="size-[55px] rounded-full object-top object-cover" src="img/noyan.jpg" alt="">
                    <div class="flex flex-col justify-center">
                        <span class="font-bold text-lg">Noyan</span>
                        <span>Ertuğrul! En ölümcül saldırıma hazır ol.</span>
                    </div>
                </div>
                <div class="text-xs">9:10 AM</div>
            </div>
            <div class="flex items-center justify-between py-[9px] px-3">
                <div class="flex items-center justify-between gap-4">
                    <img class="size-[55px] rounded-full object-top object-cover" src="img/bamsi.jpg" alt="">
                    <div class="flex flex-col justify-center">
                        <span class="font-bold text-lg">Bamsi</span>
                        <span>Çok açım.</span>
                    </div>
                </div>
                <div class="text-xs">9:15 AM</div>
            </div>
            <div class="flex items-center justify-between py-[9px] px-3">
                <div class="flex items-center justify-between gap-4">
                    <img class="size-[55px] rounded-full object-top object-cover" src="img/dogan.jpg" alt="">
                    <div class="flex flex-col justify-center">
                        <span class="font-bold text-lg">Dogan</span>
                        <span>Ben çok hazırım.</span>
                    </div>
                </div>
                <div class="text-xs">9:20 AM</div>
            </div>
        </section>

</html>
