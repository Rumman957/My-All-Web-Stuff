<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="parent">
        <div class="box A"><span id="tA">A</span></div>
        <div class="box B"><span id="tB">B</span></div>
        <div class="box C"><span id="tC">C</span></div>
        <div class="box D">
            <div class="sub E"><span class="t">E</span></div>
            <div class="sub F"><span class="t">F</span></div>
            <div class="sub G"><span class="t">G</span></div>
        </div>

    </div>
</body>

</html>
