<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Structure of a webpage</title>
</head>

<body>
    <header
        style="width: 100%;height: 100px;background-color: #FF3131;font-size: xx-large;font-family: sans-serif;display: flex;justify-content: center;align-items: center;color: white;">
        &lt;header&gt;</header>

    <nav
        style="width: 100%;height: 100px;background-color: #0CC0DF;font-size: xx-large;font-family: sans-serif;display: flex;justify-content: center;align-items: center;color: white;margin-top: 5px;">
        &lt;nav&gt;</nav>
    <div style="display: flex;">
        <div>
            <section
                style="width:800px;height: 250px;background-color: #FFBD59;font-size: xx-large;font-family: sans-serif;display: flex;justify-content: center;align-items: center;color: white;margin-top: 5px;">
                &lt;section&gt;</section>

            <article
                style="width:800px;height: 250px;background-color: #FF914D;font-size: xx-large;font-family: sans-serif;display: flex;justify-content: center;align-items: center;color: white;margin-top: 5px;">
                &lt;article&gt;</article>
        </div>

        <aside
            style="width:800px;height: 500px;background-color: #FF66C4;font-size: xx-large;font-family: sans-serif;display: flex;justify-content: center;align-items: center;color: white;margin-top: 5px;box-sizing: border-box;margin-left: 5px;">
            &lt;aside&gt;</aside>
    </div>
    <header
        style="width: 100%;height: 100px;background-color: #737373;font-size: xx-large;font-family: sans-serif;display: flex;justify-content: center;align-items: center;color: white;margin-top: 5px;">
        &lt;footer&gt;</header>


</body>

</html>
