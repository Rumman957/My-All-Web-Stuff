<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>header</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background-color: #272729;
            height: 4.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 5px 2px 10px rgb(153, 146, 146);
        }



        .logo-container {
            font-size: 2rem;
            font-family: 'Saira';
            color: #8e42c0;
            margin-left: 10rem;
            user-select: none;
            font-weight: bold;
        }



        .icons-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-right: 3rem;
        }

        @media (max-width: 412px) {
            .logo-container {
                font-size: 1.3rem;
                margin-left: 1rem;
            }

            .icons-container {
                gap: 5px;
                margin-right: 1rem;

            }

            .icons-container img {
                height: 20px;
            }



        }
    </style>

</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">

                <span>Keyboard Lab</span>
            </div>
            <div class="icons-container">
                <img src="gear.svg" alt="setting">

                <img src="github.svg" alt="" height="30">

            </div>
        </nav>

    </header>
</body>

</html>
